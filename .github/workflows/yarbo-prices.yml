name: Sync Yarbo prices

on:
  schedule:
    # 8:00 AM Central, year-round enough for a sale to roll off the next morning
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update catalog from yarbo.com
        run: node scripts/sync-yarbo-prices.mjs
      - name: Commit if a price changed
        run: |
          if git diff --quiet -- src/lib/catalog.ts; then
            echo "No price change."
            exit 0
          fi
          git config user.name "kramp-enterprises"
          git config user.email "327008256+kramp-enterprises@users.noreply.github.com"
          git add src/lib/catalog.ts
          git commit -m "Update Yarbo prices from yarbo.com."
          git push
